<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{% block title %}Wellbeing Tracker{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Manrope Font -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #fbf9f4;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
        }
    </style>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dbdad5",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1b1c19",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#4f4537",
                        "on-secondary-container": "#48697a",
                        "secondary": "#426374",
                        "secondary-container": "#c5e7fc",
                        "on-secondary-fixed": "#001e2b",
                        "tertiary-container": "#807463",
                        "primary-fixed": "#caebd0",
                        "secondary-fixed-dim": "#aacbdf",
                        "surface-tint": "#486550",
                        "tertiary": "#665c4c",
                        "on-primary": "#ffffff",
                        "primary": "#47644f",
                        "background": "#fbf9f4",
                        "on-background": "#1b1c19",
                        "on-primary-fixed": "#042110",
                        "primary-container": "#5f7d67",
                        "tertiary-fixed-dim": "#d3c4b1",
                        "on-primary-fixed-variant": "#304d3a",
                        "inverse-primary": "#aeceb5",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#f0eee9",
                        "surface-container-high": "#eae8e3",
                        "on-tertiary-fixed": "#221a0e",
                        "surface-container-low": "#f5f3ee",
                        "outline": "#727972",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#c5e7fc",
                        "on-tertiary-container": "#fffeff",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#ffffff",
                        "primary-fixed-dim": "#aeceb5",
                        "on-secondary-fixed-variant": "#2a4b5b",
                        "on-error": "#ffffff",
                        "outline-variant": "#c2c8c1",
                        "surface-bright": "#fbf9f4",
                        "on-surface-variant": "#424843",
                        "inverse-on-surface": "#f2f1ec",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e4e2dd",
                        "tertiary-fixed": "#f0e0cc",
                        "surface": "#fbf9f4",
                        "surface-variant": "#e4e2dd",
                        "inverse-surface": "#30312e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "margin-mobile": "16px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "display-lg": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "body-md": ["Manrope"],
                        "label-md": ["Manrope"],
                        "label-sm": ["Manrope"],
                        "headline-sm": ["Manrope"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>

    {% block extra_css %}{% endblock %}
</head>

<body class="bg-background text-on-background min-h-screen flex">
    <!-- SideNavBar -->
    <aside
        class="fixed left-0 top-0 h-full w-64 border-r border-outline-variant bg-surface-container-low flex flex-col p-unit z-50">
        <div class="px-4 py-6 mb-8">
            <h1 class="font-headline-sm text-headline-sm font-semibold text-primary">Wellbeing</h1>
            <p class="text-on-surface-variant font-label-sm text-label-sm">Tracker</p>
        </div>
        <nav class="flex-1 space-y-2 px-2">
            <!-- Dashboard -->
            <a class="flex items-center gap-3 px-4 py-3 {% if request.resolver_match.url_name == 'dashboard' %}bg-secondary-container text-on-secondary-container rounded-lg font-semibold translate-x-1{% else %}text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high rounded-lg{% endif %} transition-all duration-200"
                href="{% url 'tracker:dashboard' %}">
                <span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
                <span class="font-label-md text-label-md">Dashboard</span>
            </a>
            <!-- Log Entry -->
            <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all duration-200 rounded-lg"
                href="{% url 'tracker:entry_create' %}">
                <span class="material-symbols-outlined" data-icon="edit_note">edit_note</span>
                <span class="font-label-md text-label-md">Log Entry</span>
            </a>
            <!-- Trends -->
            <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all duration-200 rounded-lg"
                href="#">
                <span class="material-symbols-outlined" data-icon="monitoring">monitoring</span>
                <span class="font-label-md text-label-md">Trends</span>
            </a>
            <!-- Insights -->
            <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all duration-200 rounded-lg"
                href="#">
                <span class="material-symbols-outlined" data-icon="lightbulb">lightbulb</span>
                <span class="font-label-md text-label-md">Insights</span>
            </a>
            <!-- Goals -->
            <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all duration-200 rounded-lg"
                href="#">
                <span class="material-symbols-outlined" data-icon="flag">flag</span>
                <span class="font-label-md text-label-md">Goals</span>
            </a>
        </nav>
        <div class="px-4 py-6 mt-auto border-t border-outline-variant space-y-4">
            <button
                class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 rounded-xl shadow-sm hover:translate-y-[-2px] transition-all duration-200">
                New Entry
            </button>
            <div class="space-y-1">
                <a class="flex items-center gap-3 px-4 py-2 text-on-surface-variant hover:text-on-surface transition-colors"
                    href="#">
                    <span class="material-symbols-outlined" data-icon="help">help</span>
                    <span class="font-label-md text-label-md">Support</span>
                </a>
                <a class="flex items-center gap-3 px-4 py-2 text-on-surface-variant hover:text-on-surface transition-colors"
                    href="#">
                    <span class="material-symbols-outlined" data-icon="logout">logout</span>
                    <span class="font-label-md text-label-md">Sign Out</span>
                </a>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="ml-64 flex-1 flex flex-col min-h-screen">
        <!-- TopAppBar -->
        <header
            class="flex justify-between items-center h-16 px-margin-desktop mx-6 w-auto border-b border-outline-variant bg-transparent">
            <div class="flex items-center gap-4">
                <h2 class="font-headline-sm text-headline-sm font-bold text-primary">{% block page_title %}Wellbeing{% endblock %}</h2>
                <div class="relative hidden lg:block">
                    <span
                        class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant"
                        data-icon="search">search</span>
                    <input
                        class="bg-surface-container-low border-none rounded-full pl-10 pr-4 py-2 text-label-md focus:ring-2 focus:ring-primary/20 w-64"
                        placeholder="Search patterns..." type="text" />
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-4">
                    <button
                        class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors relative">
                        <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
                        <span
                            class="absolute top-2 right-2 w-2 h-2 bg-error rounded-full border-2 border-surface"></span>
                    </button>
                    <button
                        class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors">
                        <span class="material-symbols-outlined" data-icon="settings">settings</span>
                    </button>
                </div>
                <div class="h-8 w-8 rounded-full overflow-hidden border border-outline-variant">
                    <img alt="User profile"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjsqPRLIm_0Sac2bfd06zrvl6tt0XdtgUHqGTeRFtwb1LTZ5a5cWGybf6bvemtu-gB9cDnO7aMpb80-GDgMUmMQwIjjLhyXUbgZPxoKOcHN6RlsfVgkggWrYT9myn-JoQr3Ox2fkE_elCT-5YLRP-HKNvJ8n2vkx1qfmijMo2qIrY-FncJ4O6bLOO3Kdcfq4MBEOtp_2CPWTMaXu2TwakBixJZ0DDW5FWuEj2ifLcgosgl2uKolpwnV8qttLk20P5GM-FOk3_o8XTO" />
                </div>
            </div>
        </header>

        <!-- Dashboard Canvas -->
        <div class="flex-1 px-margin-desktop pt-8 pb-margin-desktop mx-6 space-y-16 max-w-[1200px]">
            {% block content %}{% endblock %}
        </div>

    </main>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>

    {% block extra_js %}{% endblock %}
</body>

</html>
